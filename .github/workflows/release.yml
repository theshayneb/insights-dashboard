name: Release

# Every push to main: if manifest.json's version has no release yet, check,
# build and publish it (the release creates the tag). BRAT installs from these
# releases. Pushes that don't change the version only run the checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm test
      - run: npm run build

      - name: Check versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "❌ manifest.json ($VERSION) and package.json ($PKG_VERSION) versions differ"
            exit 1
          fi
          if ! jq -e --arg v "$VERSION" 'has($v)' versions.json > /dev/null; then
            echo "❌ versions.json has no entry for $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "❌ CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file /tmp/notes.md
